<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">AURUM</title>
  <desc id="desc">Eight-bit AURUM banner for adaptive XAUUSD research on MetaTrader 5</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#87909d" stroke-opacity="0.055" stroke-width="2"/>
    </pattern>
    <g id="pixel-a">
      <rect x="36" y="0" width="54" height="18"/>
      <rect x="18" y="18" width="18" height="18"/>
      <rect x="90" y="18" width="18" height="18"/>
      <rect x="0" y="36" width="18" height="90"/>
      <rect x="108" y="36" width="18" height="90"/>
      <rect x="18" y="72" width="90" height="18"/>
    </g>
  </defs>

  <g shape-rendering="crispEdges">
    <rect width="1200" height="320" fill="#080a0e"/>
    <rect x="8" y="8" width="1184" height="304" fill="#10141a" stroke="#6f5421" stroke-width="8"/>
    <rect x="20" y="20" width="1160" height="280" fill="url(#grid)"/>

    <rect x="34" y="34" width="12" height="12" fill="#d9ad4a"/>
    <rect x="1154" y="34" width="12" height="12" fill="#d9ad4a"/>
    <rect x="34" y="274" width="12" height="12" fill="#d9ad4a"/>
    <rect x="1154" y="274" width="12" height="12" fill="#d9ad4a"/>

    <g transform="translate(76 84)">
