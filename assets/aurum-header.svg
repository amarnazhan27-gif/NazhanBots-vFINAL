      <rect x="-8" y="82" width="24" height="30" fill="#707987"/>
      <rect x="48" y="28" width="8" height="108" fill="#d9ad4a"/>
      <rect x="40" y="52" width="24" height="48" fill="#d9ad4a"/>
      <rect x="96" y="50" width="8" height="94" fill="#707987"/>
      <rect x="88" y="76" width="24" height="42" fill="#707987"/>
      <rect x="144" y="8" width="8" height="116" fill="#d9ad4a"/>
