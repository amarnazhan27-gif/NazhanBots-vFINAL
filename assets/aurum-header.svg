    <text x="310" y="198" fill="#d9ad4a" font-family="Menlo, Consolas, 'Courier New', monospace"
          font-size="20" font-weight="700" letter-spacing="3">XAUUSD RESEARCH SYSTEM</text>

    <rect x="310" y="224" width="386" height="34" fill="#171d25" stroke="#4d5664" stroke-width="4"/>
    <text x="326" y="247" fill="#aeb6c2" font-family="Menlo, Consolas, 'Courier New', monospace"
